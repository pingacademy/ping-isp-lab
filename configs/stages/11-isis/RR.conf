frr version 10.2
frr defaults traditional
hostname RR
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.100/32
 ip router isis PING
 isis passive
exit
!
interface eth1
 description to-P3
 ip address 10.1.13.0/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth2
 description to-P4
 ip address 10.1.14.0/31
 ip router isis PING
 isis network point-to-point
exit
!
router isis PING
 net 49.0001.0102.5500.0100.00
 is-type level-2-only
 metric-style wide
 set-overload-bit
 log-adjacency-changes
exit
!
