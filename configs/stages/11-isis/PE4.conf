frr version 10.2
frr defaults traditional
hostname PE4
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.14/32
 ip router isis PING
 isis passive
exit
!
interface eth1
 description to-PE3
 ip address 10.1.11.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth2
 description to-P4
 ip address 10.1.12.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth3
 description to-CE4
exit
!
router isis PING
 net 49.0001.0102.5500.0014.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
