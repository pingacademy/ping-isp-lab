frr version 10.2
frr defaults traditional
hostname P1
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.1/32
 ip router isis PING
 isis passive
exit
!
interface eth1
 description to-PE1
 ip address 10.1.1.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth2
 description to-P2
 ip address 10.1.5.0/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth3
 description to-P3
 ip address 10.1.6.0/31
 ip router isis PING
 isis network point-to-point
exit
!
router isis PING
 net 49.0001.0102.5500.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
