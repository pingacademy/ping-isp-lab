frr version 10.2
frr defaults traditional
hostname PE2
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.12/32
 ip router isis PING
 isis passive
exit
!
interface eth1
 description to-PE1
 ip address 10.1.3.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth2
 description to-P3
 ip address 10.1.4.0/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth3
 description to-CE2
exit
!
router isis PING
 net 49.0001.0102.5500.0012.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
ip route 203.0.113.64/26 Null0
!
router bgp 65000
 bgp router-id 10.255.0.12
 neighbor 10.255.0.100 remote-as 65000
 neighbor 10.255.0.100 description RR
 neighbor 10.255.0.100 update-source lo
 !
 address-family ipv4 unicast
  network 203.0.113.64/26
  neighbor 10.255.0.100 next-hop-self
 exit-address-family
exit
!
