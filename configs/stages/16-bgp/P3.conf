frr version 10.2
frr defaults traditional
hostname P3
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.3/32
 ip router isis PING
 isis passive
exit
!
interface eth1
 description to-PE1
 ip address 10.1.2.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth2
 description to-PE2
 ip address 10.1.4.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth3
 description to-P1
 ip address 10.1.6.1/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth4
 description to-P4
 ip address 10.1.8.0/31
 ip router isis PING
 isis network point-to-point
exit
!
interface eth5
 description to-RR
 ip address 10.1.13.1/31
 ip router isis PING
 isis network point-to-point
exit
!
router isis PING
 net 49.0001.0102.5500.0003.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
