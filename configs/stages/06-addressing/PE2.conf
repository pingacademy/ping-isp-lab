frr version 10.2
frr defaults traditional
hostname PE2
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.12/32
exit
!
interface eth1
 description to-PE1
 ip address 10.1.3.1/31
exit
!
interface eth2
 description to-P3
 ip address 10.1.4.0/31
exit
!
interface eth3
 description to-CE2
exit
!
