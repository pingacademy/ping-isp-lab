frr version 10.2
frr defaults traditional
hostname PE4
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.14/32
exit
!
interface eth1
 description to-PE3
 ip address 10.1.11.1/31
exit
!
interface eth2
 description to-P4
 ip address 10.1.12.1/31
exit
!
interface eth3
 description to-CE4
exit
!
