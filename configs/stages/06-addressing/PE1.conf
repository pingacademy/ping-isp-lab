frr version 10.2
frr defaults traditional
hostname PE1
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.11/32
exit
!
interface eth1
 description to-P1
 ip address 10.1.1.0/31
exit
!
interface eth2
 description to-P3
 ip address 10.1.2.0/31
exit
!
interface eth3
 description to-PE2
 ip address 10.1.3.0/31
exit
!
interface eth4
 description to-CE1
exit
!
