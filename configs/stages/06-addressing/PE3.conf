frr version 10.2
frr defaults traditional
hostname PE3
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.13/32
exit
!
interface eth1
 description to-P2
 ip address 10.1.9.1/31
exit
!
interface eth2
 description to-P4
 ip address 10.1.10.1/31
exit
!
interface eth3
 description to-PE4
 ip address 10.1.11.0/31
exit
!
interface eth4
 description to-CE3
exit
!
