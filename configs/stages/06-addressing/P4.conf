frr version 10.2
frr defaults traditional
hostname P4
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.4/32
exit
!
interface eth1
 description to-P2
 ip address 10.1.7.1/31
exit
!
interface eth2
 description to-P3
 ip address 10.1.8.1/31
exit
!
interface eth3
 description to-PE3
 ip address 10.1.10.0/31
exit
!
interface eth4
 description to-PE4
 ip address 10.1.12.0/31
exit
!
interface eth5
 description to-RR
 ip address 10.1.14.1/31
exit
!
