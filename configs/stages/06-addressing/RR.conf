frr version 10.2
frr defaults traditional
hostname RR
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.100/32
exit
!
interface eth1
 description to-P3
 ip address 10.1.13.0/31
exit
!
interface eth2
 description to-P4
 ip address 10.1.14.0/31
exit
!
