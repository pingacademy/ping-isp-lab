frr version 10.2
frr defaults traditional
hostname P3
log syslog informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 10.255.0.3/32
exit
!
interface eth1
 description to-PE1
 ip address 10.1.2.1/31
exit
!
interface eth2
 description to-PE2
 ip address 10.1.4.1/31
exit
!
interface eth3
 description to-P1
 ip address 10.1.6.1/31
exit
!
interface eth4
 description to-P4
 ip address 10.1.8.0/31
exit
!
interface eth5
 description to-RR
 ip address 10.1.13.1/31
exit
!
